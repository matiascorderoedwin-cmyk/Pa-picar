<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión · Pa Picar</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8eee3;color:#673916;font-family:system-ui,Arial;padding:20px}.card{width:min(100%,420px);background:#fffaf4;border-radius:24px;padding:38px;box-shadow:0 15px 40px #67391620}.brand{text-align:center}.brand h1{font-size:42px;margin:4px 0;color:#81451f}.brand p{margin:0 0 30px}label{display:block;font-weight:650;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #d9c5b1;border-radius:10px;font-size:16px}button{width:100%;padding:14px;margin-top:24px;border:0;border-radius:10px;background:#81451f;color:white;font-size:16px;font-weight:700;cursor:pointer}.alert{background:#ffe8df;color:#8a2518;padding:12px;border-radius:9px}.note{text-align:center;font-size:12px;color:#896e58;margin-top:22px}</style>
<link rel="stylesheet" href="{{ url_for('static', filename='pa-picar-marca.css') }}">
</head><body class="login-picar"><main class="card"><div class="brand"><img class="logo-picar" src="{{ url_for('static', filename='logo-pa-picar.png') }}" alt="Logo original de Pa Picar"><p>Facturación y administración</p></div>{% with mensajes=get_flashed_messages(with_categories=true) %}{% for cat,msg in mensajes %}<p class="alert">{{msg}}</p>{% endfor %}{% endwith %}<form method="post" action="{{url_for('login')}}"><input type="hidden" name="csrf" value="{{csrf_token()}}"><label for="usuario">Usuario</label><input id="usuario" name="usuario" autocomplete="username" required maxlength="80"><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" autocomplete="current-password" required><button>Iniciar sesión</button></form><p class="note">Acceso exclusivo para personal autorizado</p></main></body></html>

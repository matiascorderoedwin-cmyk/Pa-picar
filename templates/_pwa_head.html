{# Configuración PWA para iPhone: zona administrativa y catálogo público independientes. #}
{% set cliente_pwa = request.endpoint in ('pedidos_publicos', 'enviar_pedido', 'pedido_recibido') %}
<link rel="manifest" href="{{ url_for('static', filename='pwa/manifest-pedidos.webmanifest' if cliente_pwa else 'pwa/manifest-admin.webmanifest') }}">
<meta name="theme-color" content="#77401d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{ 'Pa Picar Pedidos' if cliente_pwa else 'Pa Picar' }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('pwa_icon', size=180) }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('pwa_icon', size=192) }}">
<script src="{{ url_for('static', filename='pwa/register.js') }}" defer></script>
